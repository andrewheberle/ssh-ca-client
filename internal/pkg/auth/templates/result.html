<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root {
    --bg: #f3f5f4;
    --card: #ffffff;
    --border: #dde3e0;
    --fg: #1c2421;
    --muted: #5d6b66;
    --ok: #1f7a4d;
    --ok-soft: #e3f2ea;
    --err: #b3261e;
    --err-soft: #fbe7e5;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141917;
      --card: #1c2320;
      --border: #2c3632;
      --fg: #e6ece9;
      --muted: #9aa8a2;
      --ok: #4cc58a;
      --ok-soft: #1d3329;
      --err: #f2827a;
      --err-soft: #3a2220;
      color-scheme: dark;
    }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    display: grid;
    place-items: center;
    padding-inline: 16px;
    box-sizing: border-box;
  }
  main {
    width: 100%;
    max-width: 26rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 1.75rem 1.5rem;
    display: grid;
    gap: 0.75rem;
    justify-items: center;
    text-align: center;
    box-sizing: border-box;
  }
  .icon {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: var(--ok-soft);
    color: var(--ok);
    display: grid;
    place-items: center;
  }
  .error .icon {
    background: var(--err-soft);
    color: var(--err);
  }
  h1 { margin: 0.25rem 0 0; font-size: 1.25rem; font-weight: 600; text-wrap: balance; }
  p { margin: 0; color: var(--muted); max-width: 32ch; }
  footer {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    width: 100%;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body{{if .Error}} class="error"{{end}}>
<main>
  <div class="icon" aria-hidden="true">
    {{- if .Error}}
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    {{- else}}
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    {{- end}}
  </div>
  <h1>{{.Title}}</h1>
  {{- range .Messages}}
  <p>{{.}}</p>
  {{- end}}
  <footer>ssh-ca-client</footer>
</main>
</body>
</html>
