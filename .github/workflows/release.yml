name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  # Release tooling is pinned, so a new release of a tool can't change the
  # build between CI and tagging. Renovate updates GORELEASER_VERSION, and
  # build.yml and release.yml must use the same versions.
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.2
  # snapcraft's major version track. Renovate doesn't update snap channels,
  # so move to the next track by hand.
  SNAPCRAFT_CHANNEL: 9.x/stable

jobs:
  client:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no cache, as this job can write releases and sign
          cache: false
      - name: Generate code with go generate
        run: |
          go generate ./...
          git diff --exit-code -- . || (echo "Generated code is out of date. Please run 'go generate ./...' and commit the changes." && exit 1)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
        with:
          channel: ${{ env.SNAPCRAFT_CHANNEL }}
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifact
          path: dist
          retention-days: 1

  snapcraft:
    name: snap
    runs-on: ubuntu-latest
    needs: client
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Install Snapcraft and Log In
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
        with:
          channel: ${{ env.SNAPCRAFT_CHANNEL }}
      # a prerelease goes to the candidate channel, not stable, matching the
      # apt job, which skips prereleases, and GoReleaser's prerelease: auto
      - name: Upload to Snap Store
        run: find dist -name *.snap -exec snapcraft upload {} --release="$SNAP_CHANNEL" \;
        env:
          TERM: dumb
          SNAP_CHANNEL: ${{ contains(github.ref_name, '-') && 'candidate' || 'stable' }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  msi:
    name: msi
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: client
    steps:
      - name: Install wixl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git wixl wixl-data
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      # named to match the GoReleaser packages, such as the .deb files
      - name: Build MSI
        run: |
          msi="dist/ssh-ca-client_${GITHUB_REF_NAME#v}_windows_amd64.msi"
          templates/build-msi.sh "$GITHUB_REF_NAME" "$msi"
          mkdir -p msi
          mv "$msi" msi/
          cd msi && sha256sum -- *.msi > "$RUNNER_TEMP/msi.sha256"
      - name: Attest MSI
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/msi.sha256
      - name: Upload MSI as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-artifact
          path: msi/*.msi
          retention-days: 1

  # GoReleaser leaves the release as a draft, as an immutable release can't
  # have assets added once published, so the MSI is added here before the
  # release is published. The release is only published once the snap and apt
  # packages are also out. The apt job is skipped for prereleases, so a
  # skipped repo job is allowed here
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs: [msi, snapcraft, repo]
    if: ${{ !cancelled() && needs.msi.result == 'success' && needs.snapcraft.result == 'success' && (needs.repo.result == 'success' || needs.repo.result == 'skipped') }}
    steps:
      - name: Download GoReleaser artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-artifact
          path: msi
      # GoReleaser signs checksums.txt before the MSI is built, so the MSI is
      # added and the file signed again with the same command GoReleaser uses.
      # This starts from GoReleaser's checksums.txt, so a re-run is safe
      - name: Add MSI to checksums.txt
        run: |
          (cd msi && sha256sum -- *.msi) >> dist/checksums.txt
          LC_ALL=C sort -k 2 -o dist/checksums.txt dist/checksums.txt
          cat dist/checksums.txt
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums.txt
        run: cosign sign-blob --bundle=dist/checksums.txt.sigstore.json dist/checksums.txt --yes
      - name: Add MSI and checksums to release
        run: |
          gh release upload "$GITHUB_REF_NAME" msi/*.msi \
            dist/checksums.txt dist/checksums.txt.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      # a prerelease can't be marked as latest, matching GoReleaser's
      # make_latest handling when it published the release
      - name: Publish release
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # prereleases are skipped so they aren't published to the stable codename,
  # matching GoReleaser's prerelease: auto
  repo:
    name: apt
    runs-on: ubuntu-latest
    needs: client
    if: ${{ !contains(github.ref_name, '-') }}
    # two releases close together must not race on the repository index
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    env:
      # R2 does not support CRC32 checksums introduced in AWS SDK
      # https://github.com/aws/aws-sdk-ruby/issues/3166
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
      # renovate: datasource=rubygems depName=deb-s3
      DEB_S3_VERSION: 26.1.0
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Import GPG key
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install deb-s3
        run: sudo gem install deb-s3 --version "$DEB_S3_VERSION" --no-document
      # one upload for all packages, so the index is only rewritten and signed
      # once. Credentials are read by the AWS SDK from the environment
      - name: Upload .deb packages to repo
        run: |
          deb-s3 upload \
            --bucket packages \
            --s3-region auto \
            --endpoint "$R2_ENDPOINT" \
            --sign "$GPG_KEY_ID" \
            --codename stable \
            --component main \
            --prefix ssh-ca-client \
            --visibility nil \
            dist/*.deb
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Upload public key to apt repo
        run: |
          gpg --armor --export "$GPG_KEY_ID" > pubkey.gpg
          aws s3 cp pubkey.gpg s3://packages/ssh-ca-client/pubkey.gpg \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
