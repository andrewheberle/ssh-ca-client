name: Run tests and upload coverage

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # match release builds in .goreleaser.yaml
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install Go dependencies
        run: go mod download

      - name: Run Go tests with coverage
        # bash avoids PowerShell splitting -coverprofile=coverage.txt on Windows
        shell: bash
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: andrewheberle/ssh-ca-client
          flags: ${{ runner.os }}

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  tests-ok:
    name: tests-ok
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all test jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
