name: End-to-end tests

permissions:
  contents: read

on:
  # not run on push to main, as the release PR runs these against main
  # before anything is tagged
  pull_request:
  # allows andrewheberle/serverless-ssh-ca to run these tests against
  # unreleased changes
  workflow_call:
    inputs:
      ca-ref:
        description: Git ref of andrewheberle/serverless-ssh-ca to build and test against instead of the pinned npm version
        type: string
        default: ''
      client-ref:
        description: Git ref of the client to test, or "latest" for the latest release
        type: string
        default: main

jobs:
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # the CA runs on Node.js and on Cloudflare Workers, which is tested
        # under workerd
        runtime: [node, workerd]
        include:
          - os: ubuntu-latest
            race: '-race'
            cgo: 1
          # the race detector needs cgo and a C toolchain, so Windows is
          # tested without it to match release builds in .goreleaser.yaml
          - os: windows-latest
            race: ''
            cgo: 0
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      E2E_CA_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Resolve client ref
        id: client
        if: ${{ inputs.client-ref }}
        shell: bash
        env:
          CLIENT_REF: ${{ inputs.client-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$CLIENT_REF"
          if [ "$ref" = "latest" ]; then
            ref="$(gh release view --repo andrewheberle/ssh-ca-client --json tagName --jq .tagName)"
          fi
          echo "Testing client at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # when called from another repository the client must be named
      # explicitly, as github.repository is the caller
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.client-ref && 'andrewheberle/ssh-ca-client' || github.repository }}
          ref: ${{ steps.client.outputs.ref }}
          persist-credentials: false

      - name: Checkout CA
        if: ${{ inputs.ca-ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrewheberle/serverless-ssh-ca
          ref: ${{ inputs.ca-ref }}
          # leading underscore keeps it out of ./... for the go tool
          path: _ca
          persist-credentials: false

      # caching is disabled as this workflow can check out arbitrary refs,
      # which could otherwise poison caches used by the default branch
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      # the test server package only exists in CA refs from after it was
      # added, so it is only built when present
      - name: Build CA packages
        if: ${{ inputs.ca-ref }}
        working-directory: _ca
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build -w packages/core
          tarball="$(npm pack -w packages/core --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "CA_TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
          if [ -d packages/testing ]; then
            npm run build -w packages/testing
            tarball="$(npm pack -w packages/testing --pack-destination "$RUNNER_TEMP" | tail -n 1)"
            echo "CA_TESTING_TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
          fi

      - name: Install CA dependencies
        working-directory: internal/e2e/testdata/ca
        run: npm ci --no-audit --no-fund

      # done here rather than with E2E_CA_PACKAGE and E2E_CA_TESTING_PACKAGE
      # so that client releases from before they existed can also be tested.
      # The test server is only replaced for clients that use it, rather than
      # running the CA with their own harness scripts.
      - name: Install CA packages
        if: ${{ inputs.ca-ref }}
        working-directory: internal/e2e/testdata/ca
        shell: bash
        run: |
          tarballs=("$CA_TARBALL")
          if [ -n "${CA_TESTING_TARBALL:-}" ] && grep -q '"@andrewheberle/serverless-ssh-ca-testing"' package.json; then
            tarballs+=("$CA_TESTING_TARBALL")
          fi
          npm install --no-save --no-audit --no-fund "${tarballs[@]}"

      # client releases from before workerd was supported ignore
      # E2E_CA_RUNTIME, so would only repeat the Node.js tests. Clients
      # support it with their own harness script (workerd.mjs) or the CA's
      # test server package.
      - name: Run end-to-end tests
        shell: bash
        run: |
          if [ "$E2E_CA_RUNTIME" = "workerd" ] && [ ! -f internal/e2e/testdata/ca/workerd.mjs ] &&
            ! grep -q '"@andrewheberle/serverless-ssh-ca-testing"' internal/e2e/testdata/ca/package.json; then
            echo "::notice::The client under test cannot run the CA under workerd, skipping"
            exit 0
          fi
          go test -tags e2e ${{ matrix.race }} -v ./internal/e2e/...

      # compared with the schema committed in the client under test, so when
      # client-ref is "latest" this reports server changes that would break
      # clients already released. Run whatever the test result so both are
      # reported.
      - name: Export CA schema
        if: ${{ !cancelled() && inputs.ca-ref && runner.os == 'Linux' }}
        working-directory: _ca
        run: npm run schema -w packages/core

      # review is disabled so the schemas are not uploaded to oasdiff.com,
      # and no token is passed as there is no PR comment to post
      - name: Check CA schema for breaking changes
        if: ${{ !cancelled() && inputs.ca-ref && runner.os == 'Linux' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: internal/pkg/api/openapi.json
          revision: _ca/packages/core/openapi.json
          fail-on: ERR
          review: 'false'
          github-token: ''

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  e2e-ok:
    name: e2e-ok
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all end-to-end tests passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
