name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions: {}

env:
  # Release tooling is pinned, so a new release of a tool can't change the
  # build between CI and tagging. Renovate updates GORELEASER_VERSION, and
  # build.yml and release.yml must use the same versions.
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.2
  # snapcraft's major version track. Renovate doesn't update snap channels,
  # so move to the next track by hand.
  SNAPCRAFT_CHANNEL: 9.x/stable

jobs:
  client:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate code with go generate
        run: |
          go generate ./...
          git diff --exit-code -- . || (echo "Generated code is out of date. Please run 'go generate ./...' and commit the changes." && exit 1)
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
        with:
          channel: ${{ env.SNAPCRAFT_CHANNEL }}
      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --snapshot --skip sign
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifact
          path: dist
          retention-days: 1
  # the go generate check in the client job covers api.gen.go matching
  # openapi.json, so this only needs to check openapi.json against the schema
  # shipped in the pinned CA package
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install CA package
        working-directory: internal/e2e/testdata/ca
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare schema with CA package
        run: |
          cmp internal/pkg/api/openapi.json internal/e2e/testdata/ca/node_modules/@andrewheberle/serverless-ssh-ca/openapi.json || (echo "::error::internal/pkg/api/openapi.json does not match the pinned CA package. Run 'npm run sync-schema --prefix internal/e2e/testdata/ca' and commit the changes." && exit 1)
  units:
    name: units (${{ matrix.os }})
    # systemd-analyze from the current and previous Ubuntu LTS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify systemd units
        # systemd ignores unknown directives and bad values when it loads a
        # unit, so a typo would silently drop part of the sandbox
        run: |
          set -euo pipefail

          # a short temporary directory, as systemd refuses socket paths that are too
          # long when it loads the runner's own user units
          work="$(mktemp -d /tmp/units.XXXXXX)"
          stub="$work/ssh-ca-client-cli"
          printf '#!/bin/sh\n' > "$stub"
          chmod +x "$stub"

          # verify checks that ExecStart= exists, so the units run a stub instead
          mkdir -p "$work/system" "$work/user" "$work/runtime"
          names=()
          for dir in system user; do
            src=systemd
            [ "$dir" = user ] && src=systemd-user
            for f in "$src"/*; do
              sed "s#/usr/bin/ssh-ca-client-cli#$stub#" "$f" > "$work/$dir/$(basename "$f")"
              names+=("$(basename "$f")")
            done
          done

          status=0
          (cd "$work/system" && systemd-analyze verify ./*) > "$work/verify.log" 2>&1 || status=$?
          (cd "$work/user" && XDG_RUNTIME_DIR="$work/runtime" systemd-analyze --user verify ./*) >> "$work/verify.log" 2>&1 || status=$?
          cat "$work/verify.log"

          # unknown directives and bad values are only warnings, so any line about our
          # units fails the check, as does a non-zero exit
          failed=0
          for name in "${names[@]}"; do
            if grep -F -- "$name" "$work/verify.log" > /dev/null; then
              echo "::error::systemd-analyze verify reported problems with $name"
              failed=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::systemd-analyze verify exited with status $status"
            failed=1
          fi
          exit "$failed"
  snapcraft:
    name: Publish Snap
    runs-on: ubuntu-latest
    needs: client
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Install Snapcraft and Log In
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
        with:
          channel: ${{ env.SNAPCRAFT_CHANNEL }}
      - name: Upload to Snap Store
        run: find dist -name *.snap -exec snapcraft upload {} --release=edge \;
        env:
          TERM: dumb
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  msi:
    name: msi
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    needs: client
    steps:
      - name: Install wixl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git wixl wixl-data
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Build MSI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(git describe --tags)"
          templates/build-msi.sh "$version" "dist/ssh-ca-client_${version#v}_windows_amd64.msi"
      # The same MSI one patch version higher, for msi-test to upgrade to
      - name: Build upgrade MSI
        run: |
          version="$(git describe --tags | sed -e 's/^v//' -e 's/[-+].*$//')"
          upgrade="$(printf '%s' "$version" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')"
          mkdir -p dist/upgrade
          templates/build-msi.sh "$upgrade" "dist/upgrade/ssh-ca-client_${upgrade}_windows_amd64.msi"
      - name: Upload MSI as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-artifact
          path: dist/**/*.msi
          retention-days: 1

  msi-test:
    name: msi-test
    runs-on: windows-latest
    needs: msi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-artifact
          path: msi
      - name: Install, check, upgrade and uninstall MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path msi -Filter *.msi | Select-Object -First 1
          $upgrade = Get-ChildItem -Path msi/upgrade -Filter *.msi | Select-Object -First 1
          ./templates/test-msi.ps1 -Msi $msi.FullName -UpgradeMsi $upgrade.FullName
      - name: Upload msiexec logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msiexec-logs
          path: ${{ runner.temp }}/msi-*.log
          retention-days: 7

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  build-ok:
    name: build-ok
    runs-on: ubuntu-latest
    needs: [client, schema, units, msi, msi-test]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all build jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
