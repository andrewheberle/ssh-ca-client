name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions: {}

jobs:
  client:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Generate code with go generate
        run: |
          go generate ./...
          git diff --exit-code -- . || (echo "Generated code is out of date. Please run 'go generate ./...' and commit the changes." && exit 1)
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip sign
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifact
          path: dist
          retention-days: 1
  # the go generate check in the client job covers api.gen.go matching
  # openapi.json, so this only needs to check openapi.json against the schema
  # shipped in the pinned CA package
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install CA package
        working-directory: internal/e2e/testdata/ca
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare schema with CA package
        run: |
          cmp internal/pkg/api/openapi.json internal/e2e/testdata/ca/node_modules/@andrewheberle/serverless-ssh-ca/openapi.json || (echo "::error::internal/pkg/api/openapi.json does not match the pinned CA package. Run 'npm run sync-schema --prefix internal/e2e/testdata/ca' and commit the changes." && exit 1)
  snapcraft:
    name: Publish Snap
    runs-on: ubuntu-latest
    needs: client
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Install Snapcraft and Log In
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1
      - name: Upload to Snap Store
        run: find dist -name *.snap -exec snapcraft upload {} --release=edge \;
        env:
          TERM: dumb
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  msi:
    name: msi
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    needs: client
    steps:
      - name: Install wixl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git wixl wixl-data
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifact
          path: dist
      - name: Build MSI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(git describe --tags)"
          templates/build-msi.sh "$version" "dist/ssh-ca-client_${version}_amd64.msi"
          cd dist && sha256sum "ssh-ca-client_${version}_amd64.msi" > ssh-ca-client.sha256sum
      - name: Upload MSI as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-artifact
          path: dist/**/*.msi
          retention-days: 1

  msi-test:
    name: msi-test
    runs-on: windows-latest
    needs: msi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-artifact
          path: msi
      - name: Install, check and uninstall MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path msi -Filter *.msi -Recurse | Select-Object -First 1
          ./templates/test-msi.ps1 -Msi $msi.FullName

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  build-ok:
    name: build-ok
    runs-on: ubuntu-latest
    needs: [client, schema, msi, msi-test]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all build jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
